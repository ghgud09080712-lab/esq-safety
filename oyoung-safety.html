<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>통합안전점검 · ㈜오영</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --dark:#0F172A;--dark2:#1E293B;--dark3:#334155;
  --muted:#64748B;--muted2:#94A3B8;--light:#F1F5F9;--white:#fff;
  --radius:12px;--radius-lg:16px;
}
html,body{height:100%;background:#0F172A;font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden}

/* ── 공통 ── */
.btn{cursor:pointer;border:none;outline:none;font-family:inherit;font-size:13px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(0.96);opacity:.85}
input,textarea{font-family:inherit;outline:none}
textarea{resize:none}

/* ── 홈 ── */
#home{background:#0F172A;min-height:100vh}
.home-header{background:linear-gradient(160deg,#1E3A5F 0%,#0F172A 100%);padding:44px 20px 24px}
.company-label{color:#475569;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.app-title{color:#F8FAFC;font-size:26px;font-weight:800;letter-spacing:-0.5px;margin-bottom:2px}
.app-date{color:#94A3B8;font-size:12px}
.inspector-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#94A3B8;border-radius:10px;padding:7px 12px;font-size:11px}
.inspector-form{margin-top:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:12px}
.inspector-form input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#F8FAFC;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:8px}
.inspector-form input:last-child{margin-bottom:0}
.dept-grid{padding:16px 16px 60px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dept-card{background:#1E293B;border-radius:var(--radius-lg);padding:14px;cursor:pointer;text-align:left;border:1.5px solid #334155;transition:border-color .2s}
.dept-card.visited{border-color:var(--dept-color, #334155)55}
.dept-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.dept-dot{width:12px;height:12px;border-radius:50%}
.dept-name{font-size:13px;font-weight:700;color:#F1F5F9;margin-bottom:2px}
.dept-stars{font-size:10px;color:#F59E0B;margin-bottom:8px}
.dept-bar-bg{background:rgba(255,255,255,.06);border-radius:4px;height:3px;margin-bottom:6px}
.dept-bar{height:3px;border-radius:4px;transition:width .3s}
.dept-footer{display:flex;justify-content:space-between;align-items:center}
.dept-prog{font-size:11px;color:#64748B}
.dept-grade{font-size:11px;font-weight:600}
.dept-score{font-size:20px;font-weight:800;line-height:1}
.dept-score-sub{font-size:10px;color:#64748B}

/* ── 점검 ── */
#inspect{background:#F8FAFC;min-height:100vh;display:none}
.inspect-header{color:#fff}
.inspect-topbar{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}
.inspect-title{font-size:15px;font-weight:700;text-align:center}
.inspect-stars{font-size:10px;opacity:.8;text-align:center}
.report-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}
.score-banner{padding:4px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between}
.score-big{font-size:38px;font-weight:900;line-height:1}
.score-sub{font-size:11px;opacity:.7}
.grade-label{font-size:17px;font-weight:700}
.progress-strip{height:3px;background:rgba(0,0,0,.2)}
.progress-fill{height:3px;background:rgba(255,255,255,.6);transition:width .3s}
.cat-tabs{display:flex;overflow-x:auto;padding:0 12px;gap:4px;background:rgba(0,0,0,.15);scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{background:transparent;border:none;color:rgba(255,255,255,.8);border-radius:8px 8px 0 0;padding:8px 12px;font-size:11px;cursor:pointer;white-space:nowrap;position:relative;flex-shrink:0;font-family:inherit;transition:all .15s}
.cat-tab.active{background:rgba(255,255,255,.9);font-weight:700}
.cat-tab .dot{position:absolute;top:4px;right:4px;width:5px;height:5px;background:#FDE68A;border-radius:50%}
.prev-bar{margin:12px 16px 0;background:#fff;border-radius:12px;padding:11px 14px;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between}
.prev-label{font-size:13px;font-weight:600;color:#1E293B}
.prev-sub{font-size:11px;color:#94A3B8}
.prev-toggle{border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid}
.items-body{padding:10px 16px 100px}
.cat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cat-title{font-size:13px;font-weight:700;color:#1E293B}
.cat-max{font-size:12px;color:#94A3B8}
.item-card{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;border:1px solid #E2E8F0;border-left:3.5px solid #E2E8F0;transition:border-color .2s}
.item-card.ok{border-left-color:#1D9E75}
.item-card.issue{border-left-color:var(--issue-color)}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.item-num{font-size:11px;color:#94A3B8;margin-bottom:2px}
.item-name{font-size:13px;font-weight:600;color:#1E293B;line-height:1.5}
.item-badge{border-radius:7px;padding:3px 9px;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-left:8px}
.status-btns{display:grid;gap:5px;margin-bottom:4px}
.status-btn{border-radius:8px;padding:9px 4px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid;transition:all .15s;font-family:inherit}
.remark-label{display:flex;align-items:center;gap:5px;margin:9px 0 5px;font-size:11px;font-weight:700;color:#64748B}
.remark-textarea{width:100%;min-height:58px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:9px 11px;font-size:12px;color:#334155;font-family:inherit;line-height:1.5}
.remark-textarea:focus{border-color:#94A3B8;background:#fff}
.photo-row{margin-top:9px}
.photo-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.photo-label{font-size:11px;font-weight:700;color:#64748B}
.photo-btn{background:#ECFDF5;border:1px solid #A7F3D0;color:#047857;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#E2E8F0;border:1px solid #CBD5E1}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-remove{position:absolute;top:4px;right:4px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(15,23,42,.78);color:#fff;font-size:14px;line-height:20px;cursor:pointer}
.report-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:7px 0}
.report-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid #E2E8F0}
.ai-btn{width:100%;margin-top:8px;background:#EFF6FF;border:none;border-radius:8px;padding:9px;font-size:12px;color:#3B82F6;cursor:pointer;font-weight:600;font-family:inherit;transition:opacity .15s}
.ai-box{margin-top:8px;background:#FFF8F0;border-radius:9px;padding:10px 12px;border:1px solid #FDE68A}
.ai-title{font-size:11px;color:#D97706;font-weight:700;margin-bottom:5px}
.ai-body{font-size:12px;color:#78350F;line-height:1.7}
.cat-subtotal{background:#F8FAFC;border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;border:1px solid #E2E8F0;margin-top:4px}
.subtotal-label{font-size:12px;color:#64748B}
.subtotal-val{font-size:16px;font-weight:800}

/* 공무팀 */
.action-rate-box{margin:10px 16px;background:#fff;border-radius:12px;padding:14px;border:1px solid #E2E8F0}
.ar-title{font-size:13px;font-weight:700;color:#1E293B;margin-bottom:4px}
.ar-sub{font-size:11px;color:#94A3B8;margin-bottom:10px}
.ar-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ar-label{font-size:11px;color:#64748B;margin-bottom:4px}
.ar-input{width:100%;border:1px solid #E2E8F0;border-radius:8px;padding:9px;font-size:16px;font-weight:700;text-align:center;font-family:inherit}
.ar-result{background:#F8FAFC;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.ar-result-label{font-size:11px;color:#64748B}
.ar-result-val{font-size:16px;font-weight:800}

/* ── 보고서 ── */
#report{background:#F8FAFC;min-height:100vh;display:none}
.report-header{color:#fff;padding:14px 16px}
.report-topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.report-meta{font-size:15px;font-weight:700}
.report-date{font-size:11px;opacity:.8}
.score-card-big{background:rgba(255,255,255,.15);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between}
.score-huge{font-size:48px;font-weight:900;line-height:1}
.score-unit{font-size:12px;opacity:.8}
.report-body{padding:14px 16px 60px}
.report-section{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:12px;border:1px solid #E2E8F0}
.section-title{font-size:13px;font-weight:700;color:#1E293B;margin-bottom:10px}
.cat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F1F5F9}
.cat-row:last-child{border-bottom:none}
.cat-row-name{font-size:12px;font-weight:600;color:#334155}
.cat-row-sub{font-size:11px;color:#94A3B8}
.cat-row-score{font-size:15px;font-weight:800}
.cat-row-ded{font-size:11px;color:#E24B4A}
.total-row{display:flex;justify-content:space-between;padding:9px 0 0;margin-top:4px}
.total-label{font-size:13px;font-weight:700;color:#1E293B}
.total-val{font-size:18px;font-weight:900}
.issue-header{font-size:13px;font-weight:700;color:#DC2626;margin-bottom:10px}
.issue-card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:10px;border:1px solid #FCA5A580;border-left:3px solid}
.issue-name{font-size:13px;font-weight:700;color:#1E293B;flex:1;padding-right:8px}
.issue-badge{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff}
.issue-cat{font-size:11px;color:#94A3B8;margin:4px 0 6px}
.issue-memo{font-size:12px;color:#475569;background:#F8FAFC;border-radius:7px;padding:7px 10px;margin-bottom:7px;line-height:1.5}
.grade-chips{display:flex;gap:5px;flex-wrap:wrap}
.grade-chip{font-size:10px;border-radius:6px;padding:3px 8px;font-weight:600}
.no-issue{background:#F0FFF8;border-radius:12px;padding:24px;text-align:center;border:1px solid #6EE7B7}
.sync-pill{position:fixed;right:14px;bottom:14px;z-index:20;background:rgba(15,23,42,.86);color:#CBD5E1;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 11px;font-size:10px;box-shadow:0 10px 24px rgba(15,23,42,.25)}

@media (min-width: 900px){
  body{background:#E2E8F0}
  #app{max-width:none;width:100%;min-height:100vh;background:#F8FAFC}
  #home{background:#F8FAFC}
  .home-header{padding:34px 40px 28px}
  .home-header>div,.inspector-form{max-width:1180px;margin-left:auto;margin-right:auto}
  .company-label{color:#94A3B8}
  .dept-grid{max-width:1180px;margin:0 auto;padding:24px 40px 70px;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  .dept-card{min-height:166px}
  .dept-name{font-size:15px}
  .dept-score{font-size:26px}
  .inspect-topbar,.score-banner,.cat-tabs{max-width:1180px;margin:0 auto}
  .prev-bar,.action-rate-box,.items-body,.report-body{max-width:980px;margin-left:auto;margin-right:auto}
  .items-body{padding-top:16px}
  .item-card{padding:16px 18px}
  .item-name{font-size:15px}
  .status-btn{font-size:12px;padding:11px 8px}
  .remark-textarea{min-height:72px}
  .report-header{padding:18px 40px}
  .report-topbar,.score-card-big{max-width:980px;margin-left:auto;margin-right:auto}
  .report-topbar{margin-bottom:12px}
}
</style>
</head>
<body>
<div id="app">
<div class="sync-pill" id="sync-pill">로컬 저장</div>

<!-- 홈 -->
<div id="home">
  <div class="home-header">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
      <div>
        <div class="company-label">㈜오영 ESQ본부</div>
        <div class="app-title">통합안전점검</div>
        <div class="app-date" id="today-date"></div>
      </div>
      <button class="btn inspector-btn" onclick="toggleEdit()">
        <span id="inspector-btn-label">점검자 입력</span>
      </button>
    </div>
    <div class="inspector-form" id="inspector-form" style="display:none">
      <input id="inp-name" placeholder="점검자 이름" oninput="updateInspector()">
      <input id="inp-date" oninput="updateInspector()">
    </div>
  </div>
  <div class="dept-grid" id="dept-grid"></div>
</div>

<!-- 점검 -->
<div id="inspect">
  <div class="inspect-header" id="inspect-header">
    <div class="inspect-topbar">
      <button class="btn back-btn" onclick="goHome()">← 홈</button>
      <div>
        <div class="inspect-title" id="inspect-dept-name"></div>
        <div class="inspect-stars" id="inspect-dept-stars"></div>
      </div>
      <button class="btn report-btn" onclick="goReport()">보고서</button>
    </div>
    <div class="score-banner">
      <div>
        <div class="score-big" id="inspect-score">100</div>
        <div class="score-sub">/ 100점</div>
      </div>
      <div style="text-align:right">
        <div class="grade-label" id="inspect-grade"></div>
        <div style="font-size:10px;opacity:.7" id="inspect-prog"></div>
      </div>
    </div>
    <div class="progress-strip"><div class="progress-fill" id="inspect-prog-bar" style="width:0%"></div></div>
    <div class="cat-tabs" id="cat-tabs"></div>
  </div>
  <div class="prev-bar">
    <div>
      <div class="prev-label">전월 미조치</div>
      <div class="prev-sub" id="prev-sub-text">있음 선택 시 -3점 반영</div>
    </div>
    <button class="btn prev-toggle" id="prev-toggle-btn" onclick="togglePrev()">없음</button>
  </div>
  <div class="action-rate-box" id="action-rate-box" style="display:none">
    <div class="ar-title">① 전월 조치율</div>
    <div class="ar-sub">미조치 건수 1건당 -5점 감점 (최대 60점)</div>
    <div class="ar-grid">
      <div><div class="ar-label">전체 의뢰 건수</div><input class="ar-input" type="number" min="0" id="ar-total" value="0" oninput="calcAR()"></div>
      <div><div class="ar-label">완료 건수</div><input class="ar-input" type="number" min="0" id="ar-done" value="0" oninput="calcAR()"></div>
    </div>
    <div class="ar-result">
      <span class="ar-result-label" id="ar-label">미조치 0건 × -5점</span>
      <span class="ar-result-val" id="ar-score-val">60 / 60점</span>
    </div>
  </div>
  <div class="items-body" id="items-body"></div>
</div>

<!-- 보고서 -->
<div id="report">
  <div class="report-header" id="report-header">
    <div class="report-topbar">
      <button class="btn back-btn" onclick="goInspect()">← 점검</button>
      <div>
        <div class="report-meta" id="report-dept-name"></div>
        <div class="report-date" id="report-date-info"></div>
      </div>
    </div>
    <div class="score-card-big">
      <div><div class="score-huge" id="report-score"></div><div class="score-unit">/ 100점</div></div>
      <div style="text-align:right">
        <div style="font-size:20px;font-weight:800" id="report-grade"></div>
        <div id="report-prev-badge" style="display:none;font-size:10px;background:rgba(0,0,0,.2);border-radius:5px;padding:2px 8px;margin-top:3px"></div>
      </div>
    </div>
  </div>
  <div class="report-body" id="report-body"></div>
</div>

</div>

const state={
  inspector:{name:"",date:new Date().toLocaleDateString("ko-KR")},
  results:{},   // itemId -> statusKey
  memos:{},     // itemId -> string
  photos:{},    // itemId -> [{url,path,createdAt}]
  prevMonth:{}, // deptId -> bool
  arData:{},    // deptId -> {total,done}
  aiAnalysis:{},// itemId -> obj
  memoOpen:{},  // itemId -> bool
  currentDeptId:null,
  currentCatIdx:0,
  loadingAI:null,
};

const STORAGE_KEY="oyoung-safety-inspection-v1";
const SYNC_DOC_PATH="shared/safety-inspection-oyoung";
let db=null;
let syncDocRef=null;
let storage=null;
let saveTimer=null;
let applyingRemote=false;

function persistedState(remote=false){
  const photos=remote
    ? Object.fromEntries(Object.entries(state.photos).map(([itemId,list])=>[
        itemId,(list||[]).filter(p=>p.path&&/^https?:\/\//.test(p.url||""))
      ]).filter(([,list])=>list.length))
    : state.photos;
  return {
    inspector:state.inspector,
    results:state.results,
    memos:state.memos,
    photos,
    prevMonth:state.prevMonth,
    arData:state.arData,
    aiAnalysis:state.aiAnalysis,
    updatedAt:new Date().toISOString()
  };
}
function applyPersisted(data){
  if(!data||typeof data!=="object") return;
  ["inspector","results","memos","photos","prevMonth","arData","aiAnalysis"].forEach(key=>{
    if(data[key]&&typeof data[key]==="object") state[key]={...state[key],...data[key]};
  });
  syncInspectorInputs();
  rerenderCurrentView();
}
function setSyncStatus(text,color){
  const pill=document.getElementById("sync-pill");
  if(!pill) return;
  pill.textContent=text;
  pill.style.color=color||"#CBD5E1";
}
function saveLocal(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(persistedState(false)));}catch{}
}
function loadLocal(){
  try{applyPersisted(JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"));}catch{}
}
function scheduleSave(){
  if(applyingRemote) return;
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveRemote,450);
}
async function saveRemote(){
  if(!syncDocRef){setSyncStatus("로컬 저장","#CBD5E1");return;}
  try{
    setSyncStatus("동기화 중","#FDE68A");
    await syncDocRef.set(persistedState(true),{merge:true});
    setSyncStatus("PC·모바일 연동","#BBF7D0");
  }catch{
    setSyncStatus("로컬 저장","#FCA5A5");
  }
}
function initSync(){
  loadLocal();
  try{
    const cfg=window.APP_FIREBASE_CONFIG;
    if(!window.firebase||!cfg){setSyncStatus("로컬 저장","#CBD5E1");return;}
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db=firebase.firestore();
    if(firebase.storage) storage=firebase.storage();
    syncDocRef=db.doc(SYNC_DOC_PATH);
    syncDocRef.onSnapshot(snap=>{
      if(!snap.exists){saveRemote();return;}
      applyingRemote=true;
      applyPersisted(snap.data());
      applyingRemote=false;
      saveLocal();
      setSyncStatus("PC·모바일 연동","#BBF7D0");
    },()=>{
      setSyncStatus("로컬 저장","#FCA5A5");
    });
  }catch{
    setSyncStatus("로컬 저장","#FCA5A5");
  }
}

// ── 유틸 ──────────────────────────────────────────────────
function getStatuses(type){return type==="A"?STATUS_A:STATUS_B;}
function getDept(id){return DEPTS.find(d=>d.id===id);}
function getGrade(s){
  if(s>=95)return{label:"⭐ 우수",color:"#1D9E75"};
  if(s>=90)return{label:"✅ 양호",color:"#3B82F6"};
  if(s>=85)return{label:"🔶 보통",color:"#F59E0B"};
  if(s>=80)return{label:"⚠️ 미흡",color:"#E27B4A"};
  return{label:"🔴 불량",color:"#E24B4A"};
}
function calcScore(dept){
  const st=getStatuses(dept.type==="C"?"B":dept.type);
  let total=0;
  for(const cat of dept.cats){
    if(cat.special==="action_rate"){
      const ar=state.arData[dept.id]||{total:0,done:0};
      const unresolved=Math.max(0,ar.total-ar.done);
      total+=Math.max(0,60-unresolved*5);
    } else {
      let ded=0;
      for(const item of cat.items){
        const k=state.results[item.id];
        if(k){const sv=st.find(s=>s.key===k);if(sv)ded+=sv.ded;}
      }
      total+=Math.max(0,cat.max-ded);
    }
  }
  if(state.prevMonth[dept.id]&&dept.prevDed>0) total=Math.max(0,total-dept.prevDed);
  return Math.min(100,total);
}
function getDeptProg(dept){
  const all=dept.cats.flatMap(c=>c.items);
  return{done:all.filter(i=>state.results[i.id]).length,total:all.length};
}
function allItems(dept){return dept.cats.flatMap(c=>c.items);}
function escapeHTML(v){
  return String(v||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function safeFileName(value){
  return String(value||"photo").replace(/[^\w.-]+/g,"_").slice(0,50);
}
function compressPhoto(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=900;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.round(img.width*scale);
        canvas.height=Math.round(img.height*scale);
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(blob=>{
          if(!blob){reject(new Error("사진 압축 실패"));return;}
          resolve({blob,dataUrl:canvas.toDataURL("image/jpeg",0.72)});
        },"image/jpeg",0.72);
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoInput(itemId,itemName,input){
  const file=input.files&&input.files[0];
  input.value="";
  if(!file) return;
  const dept=getDept(state.currentDeptId);
  setSyncStatus("사진 저장 중","#FDE68A");
  try{
    const compressed=await compressPhoto(file);
    const createdAt=new Date().toISOString();
    let photo={url:compressed.dataUrl,path:"",createdAt,deptId:dept.id,itemName};
    if(storage){
      try{
        const path=`oyoung-safety-photos/${dept.id}/${itemId}/${Date.now()}-${safeFileName(file.name||"photo.jpg")}.jpg`;
        const ref=storage.ref(path);
        await ref.put(compressed.blob,{contentType:"image/jpeg"});
        photo.url=await ref.getDownloadURL();
        photo.path=path;
      }catch{
        photo.path="";
      }
    }
    state.photos[itemId]=[...(state.photos[itemId]||[]),photo];
    scheduleSave();
    renderInspect();
    setSyncStatus(photo.path?"사진 저장 완료":"기기 저장 완료",photo.path?"#BBF7D0":"#CBD5E1");
  }catch{
    setSyncStatus("사진 저장 실패","#FCA5A5");
  }
}
async function removePhoto(itemId,idx){
  const list=state.photos[itemId]||[];
  const [photo]=list.splice(idx,1);
  state.photos[itemId]=list;
  scheduleSave();
  renderInspect();
  try{if(storage&&photo?.path) await storage.ref(photo.path).delete();}catch{}
}
function togglePrev(){
  const dept=getDept(state.currentDeptId);
  state.prevMonth[dept.id]=!state.prevMonth[dept.id];
  scheduleSave();

function calcAR(shouldSave=true){
  const dept=getDept(state.currentDeptId);
  if(!dept) return;
  const t=parseInt(document.getElementById("ar-total").value)||0;
  const d=parseInt(document.getElementById("ar-done").value)||0;
  state.arData[dept.id]={total:t,done:d};
  if(shouldSave) scheduleSave();
  const unresolved=Math.max(0,t-d);
  const sc=Math.max(0,60-unresolved*5);
  document.getElementById("ar-label").textContent=`미조치 ${unresolved}건 × -5점`;
  document.getElementById("ar-score-val").textContent=`${sc} / 60점`;
  document.getElementById("ar-score-val").style.color=dept.color;
  document.getElementById("inspect-score").textContent=calcScore(dept);
}

async function runAI(itemId,itemName){
  state.loadingAI=itemId;
  renderItems();
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,
        messages:[{role:"user",content:`산업현장 안전점검 항목: "${itemName}"\n메모: "${state.memos[itemId]||"없음"}"\n결과: 부적합\n\nJSON만 출력:\n{"riskLevel":"높음/중간/낮음","cause":"원인 1문장","action":"조치 1문장","deadline":"즉시/24시간 이내/1주일 이내"}`}]
      })
    });
    const data=await res.json();
    const text=data.content?.[0]?.text||"{}";
    state.aiAnalysis[itemId]=JSON.parse(text.replace(/```json|```/g,"").trim());
  }catch{
    state.aiAnalysis[itemId]={riskLevel:"분석실패",cause:"오류 발생",action:"수동 확인 필요",deadline:"-"};
  }
  state.loadingAI=null;
  renderItems();
}

  scheduleSave();
}

// ── 뷰 전환 ───────────────────────────────────────────────
function showView(v){
  ["home","inspect","report"].forEach(id=>{
    const el=document.getElementById(id);
    el.style.display=id===v?"block":"none";
  });
  window.scrollTo(0,0);
}
function goHome(){renderHome();showView("home");}
function goInspect(){renderInspect();showView("inspect");}

init();
</script>
</body>
</html>
