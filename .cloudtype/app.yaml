name: esq-safety
app: node@20
options:
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "4173"
    - name: DATA_DIR
      value: "/data"
  install: rm -rf node_modules package-lock.json && npm install --omit=dev && (python -m pip install --user -r requirements-ocr.txt || python3 -m pip install --user -r requirements-ocr.txt || true)
  ports: 4173/http
  start: npm start
